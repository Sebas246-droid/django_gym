{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credencial - {{ cliente.nombre }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <style>
    /*
      Pagina suelta, a proposito: la credencial se manda o se imprime, sin el
      marco del panel alrededor.

      La tarjeta ya no se dibuja aqui con CSS. Lo que se ve es el PNG que se
      comparte, para que no haya una version en pantalla distinta de la que
      recibe el socio. El dibujo vive en clientes/credencial.py.
    */
    :root { --acento: {{ gym_actual.color_primario|default:'#F5C518' }}; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 34px 20px;
      background: #ececef;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0b0b0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    /* Sin sombra ni esquinas: la imagen ya trae su propio margen y la tarjeta
       de dentro sus esquinas. Encimarle un marco se veia como dos tarjetas. */
    .credencial {
      display: block;
      width: 100%;
      max-width: 460px;
      height: auto;
    }

    .barra-acciones { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .barra-acciones a, .barra-acciones button {
      font: inherit;
      font-size: 14px;
      font-weight: 550;
      padding: 9px 18px;
      border-radius: 9px;
      border: 1px solid #d8d8e0;
      background: #fff;
      color: #0b0b0f;
      cursor: pointer;
      text-decoration: none;
    }
    .barra-acciones .principal { background: var(--acento); border-color: transparent; }
    .nota { font-size: 12.5px; color: #6b6b78; max-width: 62ch; text-align: center; }

    @media print {
      /* Solo la tarjeta, al tamano de una tarjeta bancaria. */
      @page { size: 85.6mm 54mm; margin: 0; }
      html, body { height: 100%; overflow: hidden; }
      body { padding: 0; background: #fff; gap: 0; display: block; }
      .barra-acciones, .nota { display: none; }
      .credencial {
        width: 100%;
        height: 100%;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
        /* La imagen ya trae su propio margen blanco alrededor de la tarjeta. */
        object-fit: contain;
      }
    }
  </style>
</head>
<body>

<img class="credencial" alt="Credencial de {{ cliente.nombre }}"
     src="{% url 'clientes:cliente_credencial_imagen' cliente.pk %}">

<div class="barra-acciones">
  <button type="button" class="principal" id="compartir"
          data-imagen="{% url 'clientes:cliente_credencial_imagen' cliente.pk %}"
          data-archivo="{{ cliente.nombre_de_archivo }}"
          data-titulo="Credencial de {{ cliente.nombre }}">
    Compartir
  </button>
  <a href="{% url 'clientes:cliente_credencial_imagen' cliente.pk %}"
     download="{{ cliente.nombre_de_archivo }}">Descargar imagen</a>
  <button type="button" onclick="window.print()">Imprimir</button>
  <a href="{% url 'clientes:cliente_detail' cliente.pk %}">Volver a la ficha</a>
</div>

<p class="nota">
  En el telefono, <b>Compartir</b> abre WhatsApp directo. En la computadora
  descarga la imagen para que la adjuntes. El numero grande es el que el socio
  teclea en el acceso.
</p>

<script>
  // Compartir el archivo, no el enlace: la credencial esta detras del login y
  // un enlace reenviado no le abriria a nadie. navigator.share con archivos
  // existe en moviles; en escritorio se cae a la descarga, que es lo que hay.
  document.querySelector('#compartir').addEventListener('click', async function () {
    const boton = this;
    boton.disabled = true;
    try {
      const respuesta = await fetch(boton.dataset.imagen);
      const blob = await respuesta.blob();
      const archivo = new File([blob], boton.dataset.archivo, { type: 'image/png' });

      if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
        await navigator.share({ files: [archivo], title: boton.dataset.titulo });
        return;
      }

      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = boton.dataset.archivo;
      enlace.click();
      URL.revokeObjectURL(enlace.href);
    } catch (error) {
      // Cancelar el menu de compartir tira AbortError: eso no es un fallo.
      if (error.name !== 'AbortError') {
        alert('No se pudo compartir. Usa "Descargar imagen".');
      }
    } finally {
      boton.disabled = false;
    }
  });
</script>

</body>
</html>
